name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Si en el futuro incrustas código R que debe ejecutarse al renderizar,
      # descomenta el bloque de R abajo. Para un sitio estático normal no hace falta.
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Install R deps
      #   uses: r-lib/actions/setup-renv@v2

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
